# ============================================================
# Nginx — Summer Checkin 反向代理
#============================================================
upstream nextjs {
    server app:3000;
}

upstream chatws {
    server app:3001;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # ------------------------------------------------------------
    # 主应用代理
    # ------------------------------------------------------------
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关键: 禁用缓冲以支持 AI 流式输出 (SSE/streaming)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ------------------------------------------------------------
    # WebSocket 聊天室（sidecar :3001）
    # ------------------------------------------------------------
    location /ws {
        proxy_pass http://chatws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------
    # Next.js 静态资源 — 长缓存（文件名含哈希，可 immutable）
    # 用 ^~ 前缀：使其优先于下面的正则 location，
    # 否则 .webp/.js 等会被正则那条以 30 天覆盖，反而降级。
    # ------------------------------------------------------------
    location ^~ /_next/static {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ------------------------------------------------------------
    # public/ 下的静态素材（场景背景图 / 环境音 / 图标）— 独立长缓存
    #
    # 这些文件不带内容哈希，所以不能用 immutable，用 30 天 + 回源校验。
    # 此前它们落在 location / 里：Next 对 public/ 默认不发长缓存头，
    # 导致 rain.mp3(28MB)、snow.wav(7MB) 这类文件每次访问都要重新校验。
    #
    # 注：这里不设 proxy_buffering off —— 大文件让 nginx 正常缓冲更好。
    # ------------------------------------------------------------
    location ~* \.(webp|png|jpe?g|gif|svg|ico|mp3|wav|ogg|mp4|webm|woff2?)$ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
}
